<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Portal Maestro</title>
  <meta id="meta-theme-color" name="theme-color" content="#0A3D6B">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maestro">
  <meta name="application-name" content="Maestro">
  
  <link rel="manifest" href="manifest.json">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="icone.png">
  <link rel="icon" type="image/png" href="icone.png">
  
  <link rel="stylesheet" href="style.css?v=11.9">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js" defer></script>
</head>
<body>

  {% include modais.html %}


  <div class="app-wrapper">
    <header class="app-header" id="global-header">
      <img id="ui-logo" src="icone.png" alt="Logo" class="hidden">
      <h1 id="ui-nome-sistema" class="brand-title">PORTAL MAESTRO</h1>
      <p id="ui-nome-setor" class="brand-subtitle">Acesso Estudantil</p>
      <button id="btn-settings-gear" onclick="abrirMenuConfiguracoes()" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; font-size: 24px; cursor: pointer; z-index: 10;">⚙️</button>
    </header>

    <main class="app-content">
      
      <div id="mural-avisos-header" class="section-title hidden">📌 AVISOS DA SEMANA</div>
      <div id="mural-avisos" class="avisos-container hidden"></div>

      {% include portal_publico.html %}
      {% include portal_estudante.html %}
      {% include portal_admin.html %}

    </main>

    <footer class="app-footer">
      <p id="ui-endereco" class="hidden"></p> 
      <p id="ui-email" class="hidden"></p> 
      <p id="ui-cnpj" class="hidden"></p> 
      <div class="watermark">⚡ POWERED BY MAESTRO</div>
    </footer>
  </div>

  <div id="toast"></div>

  <script src="js_global.js?v=11.9"></script>
  <script src="api_auth.js?v=11.9"></script>
  <script src="main_core.js?v=11.9"></script>
  <script src="operacao.js?v=11.9"></script>
  <script src="consulta.js?v=12.5"></script>
  <script src="carteira.js?v=12.5"></script>
  <script src="mobilidade.js?v=12.5"></script>
  <script src="inscricao.js?v=12.0"></script>

  <div id="modal-configuracoes" class="bottom-sheet-overlay hidden">
    <div class="bottom-sheet-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0; font-size: 18px; color: var(--primary);">Configurações</h3>
        <button onclick="fecharMenuConfiguracoes()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub);">✖</button>
      </div>
      
      <div class="switch-row" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border);">
        <p class="desc-xs" style="margin: 0;">Modo Escuro (Dark Mode)</p>
        <label class="switch">
          <input type="checkbox" id="dark-mode-toggle-settings" onchange="toggleDarkMode()">
          <span class="slider"></span>
        </label>
      </div>

      <button class="menu-card outline-card" onclick="navegarPeloMenu('view-validador')" style="border-color: #0d9488; background: rgba(13,148,136,0.04); margin-bottom: 10px; padding: 12px;">
        <span class="icon" style="font-size: 24px; margin-right: 12px;">🛡️</span>
        <div class="info">
          <strong style="color: #0d9488; font-size: 14px;">Validar Documento</strong>
          <span style="font-size: 10px;">Verificar autenticidade de declaração</span>
        </div>
      </button>

      <button class="menu-card dark-card" onclick="navegarPeloMenu('view-login-fiscal')" style="margin-bottom: 0; padding: 12px;">
        <span class="icon" style="font-size: 24px; margin-right: 12px;">🔐</span>
        <div class="info">
          <strong style="font-size: 14px;">Acesso da Secretaria</strong>
          <span style="font-size: 10px;">Acesso Restrito</span>
        </div>
      </button>
    </div>
  </div>
</body>
</html>
